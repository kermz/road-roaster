name: Firmware CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Run native tests
        run: pio test -e native -e native_controller -e native_rear
      - name: Build firmware
        run: pio run -e controller -e rear_display
